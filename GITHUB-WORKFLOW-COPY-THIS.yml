name: Verify and deploy Orbit 3DS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit3ds-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify browser project
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up Node.js for JavaScript syntax checks
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify HTML and JavaScript
        run: python scripts/verify_project.py

      - name: Assemble GitHub Pages site
        run: |
          rm -rf _site
          mkdir -p _site/core
          cp index.html _site/index.html
          cp core/README.md core/adapter-contract.json _site/core/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
